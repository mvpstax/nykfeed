name: Refresh Knicks Betting Results

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_run:
    workflows: ['Refresh Knicks Last Game']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: knicks-betting-results
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Save betting lines and results
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "knicks-feed-bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            node scripts/update-betting-results.mjs
            git add betting-results.json

            if git diff --cached --quiet; then
              exit 0
            fi

            git commit -m "Refresh Knicks betting results"

            if git push origin HEAD:main; then
              exit 0
            fi

            git fetch origin main
            git reset --hard origin/main
          done

          exit 1
