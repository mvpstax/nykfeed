name: Refresh Knicks Game Day

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

concurrency:
  group: knicks-betting-results
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Refresh preview and pregame odds
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          HIGHLIGHTLY_BASE_URL: ${{ vars.HIGHLIGHTLY_BASE_URL || 'https://nba.highlightly.net' }}
        run: node scripts/refresh-game-preview.mjs

      - name: Save updated preview and odds
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "knicks-feed-bot"
          git config user.email "actions@users.noreply.github.com"

          git add gameday.json odds.json

          if [ -f betting-results.json ]; then
            git add betting-results.json
          fi

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Refresh Knicks preview and pregame odds"

          for attempt in 1 2 3; do
            git pull --rebase origin main

            if git push origin HEAD:main; then
              exit 0
            fi

            sleep 5
          done

          exit 1
