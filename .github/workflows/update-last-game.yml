name: Refresh Knicks Last Game

on:
  workflow_dispatch:
  schedule:
    - cron: '11,26,41,56 * * * *'

permissions:
  contents: write

concurrency:
  group: knicks-last-game
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build last-game.json
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          HIGHLIGHTLY_BASE_URL: ${{ vars.HIGHLIGHTLY_BASE_URL || 'https://nba.highlightly.net' }}
        run: node scripts/update-last-game.mjs

      - name: Save game feeds
        run: |
          git config user.name "knicks-feed-bot"
          git config user.email "actions@users.noreply.github.com"

          git add last-game.json games.json

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Refresh Knicks games and recap"

          for attempt in 1 2 3; do
            git pull --rebase origin main

            if git push origin HEAD:main; then
              exit 0
            fi

            if [ "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)" ]; then
              exit 0
            fi

            sleep 5
          done

          exit 1
