name: Refresh Knicks feed

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: knicks-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Build feed.json
        run: node scripts/update-feed.mjs

      - name: Refresh YouTube rows
        continue-on-error: true
        run: |
          python3 -m pip install "yt-dlp==2026.08.19"
          python3 scripts/update-youtube.py

      - name: Save updated feeds
        run: |
          git config user.name "knicks-feed-bot"
          git config user.email "actions@users.noreply.github.com"

          git add feed.json

          if [ -f youtube.json ]; then
            git add youtube.json
          fi

          if git diff --cached --quiet; then
            echo "No feed changes to save."
            exit 0
          fi

          git commit -m "Refresh news and YouTube feeds"
          git pull --rebase origin main

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Feeds saved."
              exit 0
            fi

            local_sha=$(git rev-parse HEAD)
            remote_sha=$(git ls-remote origin refs/heads/main | cut -f1)

            if [ "$local_sha" = "$remote_sha" ]; then
              echo "Push reached GitHub despite the error response."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Push attempt $attempt failed; retrying shortly."
              sleep 10
            fi
          done

          echo "Could not save feeds after three attempts."
          exit 1
