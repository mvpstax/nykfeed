name: Refresh Knicks feed

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: knicks-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Build feed.json
        run: node scripts/update-feed.mjs

      - name: Refresh YouTube rows
        continue-on-error: true
        run: |
          python3 -m pip install "yt-dlp==2026.08.19"
          python3 scripts/update-youtube.py

      - name: Save updated feeds
        run: |
          git config user.name "knicks-feed-bot"
          git config user.email "actions@users.noreply.github.com"

          git add feed.json

          if [ -f youtube.json ]; then
            git add youtube.json
          fi

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Refresh news and YouTube feeds"
          git pull --rebase origin main
          git push origin HEAD:main
