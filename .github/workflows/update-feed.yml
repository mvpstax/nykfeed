name: Refresh Knicks feed

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build feed.json
        run: node scripts/update-feed.mjs
      - name: Commit changed feed
        run: |
          git config user.name "knicks-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add feed.json
          git diff --cached --quiet || git commit -m "Refresh Knicks feed"
          git push
