name: Refresh Knicks highlights

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: knicks-highlights
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Fetch highlights
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
        run: node scripts/update-highlights.mjs

      - name: Save updated highlights
        run: |
          git config user.name "knicks-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add highlights.json

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Refresh Knicks highlights"
          git pull --rebase origin main
          git push origin HEAD:main
