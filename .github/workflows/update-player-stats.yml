name: Refresh Knicks player stats

on:
  schedule:
    - cron: '20 12 * * *'
  workflow_dispatch:

concurrency:
  group: update-player-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install NBA client
        run: python -m pip install 'nba_api>=1.11,<2'

      - name: Check NBA live feed connectivity
        run: python scripts/update-player-stats.py --check

      - name: Refresh stats cache
        run: python scripts/update-player-stats.py

      - name: Commit stats cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add player-stats.json
          if [ -f player-game-history.json ]; then git add player-game-history.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh player stats"
            git push
          fi
