name: Refresh SNY Knicks Content

on:
  workflow_dispatch:

  schedule:
    - cron: '11,41 * * * *'

  workflow_run:
    workflows: ['Refresh Knicks feed']
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: knicks-sny-content
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Refresh and publish SNY content
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "knicks-feed-bot"
          git config user.email "knicks-feed-bot@users.noreply.github.com"

          for attempt in 1 2 3; do
            node scripts/update-sny.mjs

            git add feed.json youtube.json sny.json

            if git diff --cached --quiet; then
              exit 0
            fi

            git commit -m "Refresh SNY Knicks articles and videos"

            if git push origin HEAD:main; then
              exit 0
            fi

            git fetch origin main
            git reset --hard origin/main
          done

          echo "Could not publish SNY content after three attempts."
          exit 1
